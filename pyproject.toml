[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbl"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort
# Deliberately small starting set — see docs/IMPROVE_CODEBASE_ARCHITECTURE.md §5.2
select = ["E", "F", "I"]
# Ignore rules that conflict with hand-laid alignment in hardware_config.py / app.py.
# E501 (line too long) is not enforced — ruff format is NOT enabled.
ignore = [
    "E501",   # line too long — existing style uses long alignment lines deliberately
    "F401",   # imported but unused — too many false positives with conditional imports
]

[tool.ruff.lint.per-file-ignores]
# __main__ bench-tool scripts use bare print() and starred imports deliberately.
"src/rbl/hardware/vgc083_driver.py" = ["E402"]
"src/rbl/hardware/xgs600_driver.py" = ["E402"]
# Test files: stub methods use semicolons, lambda, ambiguous names, and
# intentional sys.path manipulation before import (test_layering.py).
# F841 unused variables are deliberate (side-effect-only construction, simulated state).
# E712 comparison to True/False is explicit test intent.
"tests/*" = ["F401", "F811", "E402", "E702", "E731", "E741", "E712", "F841"]
# Tool scripts use inline lambdas deliberately (curve_fit callback etc.).
"tools/*" = ["E731"]

[tool.mypy]
python_version = "3.13"
# strict = true is deferred until hardware/ and config/ are fully annotated.
# For now, enforce only the checks that are meaningful on partially-typed code.
warn_redundant_casts = true
warn_unused_ignores = true
implicit_optional = true
# Exclude files where third-party stub gaps produce spurious errors:
#   funcgen_driver: pyvisa Resource stubs don't expose .query/.write
#   camera_source:  cv2 stubs lack VideoWriter_fourcc and numpy Mat annotations
#   scope_worker:   multiple return/assignment type mismatches from missing stubs
exclude = "src/rbl/hardware/(funcgen_driver|camera_source|scope_worker|serial_transport)\\.py"
# Only check the pure layers: config/ and hardware/.
# Annotating the full GUI layer is a separate effort.
files = ["src/rbl/config", "src/rbl/hardware"]
# Third-party stubs are missing for these packages; ignore import errors.
ignore_missing_imports = true
