[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rbl"
version = "0.1.0"
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# E = pycodestyle errors, F = pyflakes, I = isort
# Deliberately small starting set — see docs/IMPROVE_CODEBASE_ARCHITECTURE.md §5.2
select = ["E", "F", "I"]
# Ignore rules that conflict with hand-laid alignment in hardware_config.py / app.py.
# E501 (line too long) is not enforced — ruff format is NOT enabled.
ignore = [
    "E501",   # line too long — existing style uses long alignment lines deliberately
    "F401",   # imported but unused — too many false positives with conditional imports
]

[tool.ruff.lint.per-file-ignores]
# __main__ bench-tool scripts use bare print() and starred imports deliberately.
"src/rbl/hardware/vgc083_driver.py" = ["E402"]
"src/rbl/hardware/xgs600_driver.py" = ["E402"]
# Test files: stub methods use semicolons, lambda, ambiguous names, and
# intentional sys.path manipulation before import (test_layering.py).
# F841 unused variables are deliberate (side-effect-only construction, simulated state).
# E712 comparison to True/False is explicit test intent.
"tests/*" = ["F401", "F811", "E402", "E702", "E731", "E741", "E712", "F841"]
# Tool scripts use inline lambdas deliberately (curve_fit callback etc.).
"tools/*" = ["E731"]

[tool.mypy]
python_version = "3.13"
# strict = true is deferred until hardware/ and config/ are fully annotated.
# For now, enforce only the checks that are meaningful on partially-typed code.
warn_redundant_casts = true
warn_unused_ignores = true
implicit_optional = true
# Third-party stubs are missing for these packages; ignore import errors.
ignore_missing_imports = true
# The whole application source tree is checked. No module is excluded by name
# here — a discovery-level `exclude` only stops mypy from treating a file as a
# *root*, it does not stop mypy from following an import into it, so an
# excluded module's errors were being reported anyway whenever a checked
# module imported it (see docs/adr/0001-tests-first-and-no-muted-failures.md,
# decision 4). tools/type_gate.py applies the differing per-layer bar below
# to this single scan's output instead.
files = ["src/rbl"]

# pyvisa's `Resource` and cv2's module surface genuinely don't declare the
# attributes these two modules use (no stubs ship for either), so no
# annotation in this repo can silence the resulting attr-defined errors.
# Scoped narrowly to these two modules and to attr-defined only — every
# other error class in either module is still reported and, since both live
# under the "hard" rbl.hardware prefix below, still fails the build.
[[tool.mypy.overrides]]
module = ["rbl.hardware.funcgen_driver", "rbl.hardware.camera_source"]
disable_error_code = ["attr-defined"]

# Per-layer type-check bar (docs/adr/0001-tests-first-and-no-muted-failures.md,
# decision 4), read by tools/type_gate.py — the wrapper CI runs in place of a
# bare `mypy` invocation:
#   hard: any error under one of these module prefixes fails the build.
#   soft (everything else under files=["src/rbl"] above): errors are printed
#     and counted against the ratchet recorded in tools/mypy_ratchet.txt,
#     which may only decrease.
[tool.rbl.type_gate]
hard = ["rbl.config", "rbl.hardware"]
