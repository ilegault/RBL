name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Check tests-first rule
        run: python scripts/check_tests_first.py

      - name: Type check (layered gate)
        id: typecheck
        continue-on-error: true
        run: python tools/type_gate.py

      - name: Enforce type gate
        if: always() && steps.typecheck.outcome != 'success'
        run: exit 1

  test:
    runs-on: windows-latest
    # The suite takes ~3 min. Without this a hung job runs for GitHub's 6 h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # --max-worker-restart=0: a worker process that crashes (segfault, abort,
      # access violation) ends the run at once, red, with "worker gwN crashed".
      # Without it xdist replaces the worker, and under --dist loadfile its
      # remove_node() puts back EVERY file the dead worker ever ran, finished ones
      # included. Handing out those empty files stalls the workers waiting for a
      # shutdown that never comes, so the job used to sit at 99% until the
      # 20-minute timeout cancelled it (pytest-xdist 3.8.0; reproduced locally by
      # aborting one test). A crash is a defect to fix, not something to retry.
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: pytest --tb=short -q -n auto --dist loadfile --max-worker-restart=0 --durations=25
