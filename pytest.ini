[pytest]
testpaths = tests
pythonpath = src
addopts = -v --tb=short
python_files = test_*.py
python_classes = Test*
python_functions = test_*
xfail_strict = true
# A hung test must FAIL (with every thread's stack printed), not sit there until the
# CI job is cancelled by hand. Normal tests take well under 10 s; the slowest legitimate
# ones (child-process / ZWO tests) take ~10 s. "thread" is the only method that works
# on the Windows control PC and CI runner.
timeout = 120
timeout_method = thread
